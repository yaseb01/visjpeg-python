[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visjpeg"
version = "2.0.0"
description = "VisJPEG - Interaktive JPEG-Kompressions-Visualisierung fuer Studierende"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "VisJPEG Contributors"}
]
keywords = ["jpeg", "dct", "compression", "visualization", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=9.0.0",
    "streamlit>=1.28.0",
    "numpy>=1.24.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
tk = []
dev = ["pytest>=7.0"]

[project.scripts]
visjpeg = "visjpeg.__main__:main"

[project.urls]
Homepage = "https://github.com/visjpeg/visjpeg"
Issues = "https://github.com/visjpeg/visjpeg/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["visjpeg*"]
